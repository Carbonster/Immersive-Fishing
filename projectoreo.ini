; ProjectOreo mod manifest.
;
; Read by Project Oreo Launcher. Describes the mod and, more importantly, declares the versions
; it was tested against. Format: ProjectOreoLauncher\docs\manifest-format.md

[Mod]
Name=Fishing Minigame Mod
; One line for the mod card in the launcher. The full text below is what Details shows.
Summary=A fish-catching minigame with configurable difficulty and physics.
Description=Adds a fish-catching minigame to No Man's Sky. Hold the line while the fish runs, keep it in the catch bar, and reel it in. Difficulty and physics are configurable. Requires Project Oreo Runtime for the overlay and controller support.
Version=0.6.1
EntryPoint=fishing_minigame_mod.py

; The versions this mod was actually tested against. These are NOT requirements and they never
; block PLAY - but they are the version the launcher PINS when it installs or repairs a package,
; and they are what puts the "Use tested" button on the pyMHF card. Without this section the
; launcher has no version to aim at and can only offer "Update" to the newest release.

[Compatibility]
NMS=6.6
; 170671.4 is a hard floor, not a preference. From mod 0.3.0 the fishing hooks and structs
; come from NMSpy (cGcFishLaser.OnModeChanged/SetMode, cGcFishManager.mCurrentFish,
; cGcSimulation.mFishManager). None of them exist before 170671.4, so an older NMSpy loads
; the mod and then fails at the hooks.
NMSpy=170671.4
; Not a preference either: NMSpy 170671.4 declares Requires-Dist pymhf[gui,http_api]>=0.2.4.
; The old note here said 0.2.4 broke NMSpy 170671.3 - that was true of 170671.3 and no
; longer applies; 170671.4 is built against 0.2.4.
pyMHF=0.2.4
Loader=0.1.6
; Declaring Runtime is also how this mod tells the launcher it needs it at all. A python mod
; that only changes game logic never draws an overlay or reads a controller and should leave
; this out; ours does both and cannot run without it.
Runtime=0.2.0
