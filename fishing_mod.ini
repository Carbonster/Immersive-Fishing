; Fishing Minigame Mod runtime configuration. This file is read by the mod, overlay and
; controller support process.

[Debug]
DebugHotkeys=false

[Logging]
; Available modes:
;   normal - recommended; records INFO, WARNING, and ERROR events.
;   debug  - also records settings, input changes, and detailed component state.
;   trace  - also records frequent raw pipe traffic; use only while reproducing a problem.
; Write one of these exact values in Mode: normal, debug, or trace.
Mode=normal

; Maximum size of each individual log file in megabytes. Allowed range: 1-50.
MaxFileMB=10

; true  - keep one copy of each log from the previous launch in logs/previous.
; false - delete the previous logs when a component starts.
KeepPrevious=true

; Used only when Mode=trace. After this many minutes, trace automatically falls back to debug
; to prevent excessive logging. Allowed range: 1-60.
TraceMinutes=10

; With MaxFileMB=10 and KeepPrevious=true, the four current and four previous component logs
; use no more than approximately 80 MB in total.
